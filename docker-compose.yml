# Четыре сервиса на отдельном сервере:
#   caddy  — принимает посетителей на 80/443 и сам получает HTTPS-сертификат
#   web    — сайт и API (снаружи недоступен, только через caddy)
#   worker — каждые 1–2 минуты забирает сообщения из Wappi и разбирает их
#   bot    — Telegram-бот: вход на сайт, подтверждение номера, уведомления владельцу
# База — один файл в папке ./data на сервере.
name: oneplusone

# Журналы контейнеров — не больше 3×20 МБ на сервис (иначе за месяцы забивают диск, как было на старом сервере)
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    # Caddy нужны только адреса сайта — пароли и ключи из .env ему не передаём
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      OLD_DOMAINS: ${OLD_DOMAINS:-http://unused.invalid}
      PICK_DOMAIN: ${PICK_DOMAIN:-http://unused-pick.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro                    # файлы сайта отдаёт сам Caddy
      - ./data:/srv/data:ro                  # и фото объектов (наружу — только /photos/<номер>/<имя>.jpg, см. Caddyfile)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro   # те же файлы, что раздаёт Caddy, — страницы и скрипты всегда одной версии
    ports:
      - "127.0.0.1:8090:8090"   # только для проверки с самого сервера
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/meta', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    command: ["nice", "-n", "10", "python", "-m", "app.worker"]  # ниже приоритет — сайт важнее
    volumes:
      - ./data:/app/data

  bot:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    command: ["python", "-m", "app.bot"]
    volumes:
      - ./data:/app/data

volumes:
  caddy_data:
  caddy_config:
