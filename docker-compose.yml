# Два сервиса на одном образе и одной базе (папка ./data на сервере):
#   web    — сайт и API, слушает только 127.0.0.1:8090 (наружу его отдаёт nginx)
#   worker — каждые 1–2 минуты забирает сообщения из Wappi и разбирает их
name: strely

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/meta', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
