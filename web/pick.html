<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подборка</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#035352">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/static/house.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/style.css?v=26">
<link rel="stylesheet" href="/static/motion.css?v=35">
<link rel="stylesheet" href="/static/pick.css?v=6">
<link rel="stylesheet" href="/static/theme.css?v=15">
<link rel="stylesheet" href="/static/glass.css?v=55">
</head>
<body>
<main class="pk">
  <header class="pk-head" id="pkHead">
    <div class="pk-cover" id="pkCover" hidden></div>
    <p class="pk-brand" id="pkBrand">Подборка объектов</p>
    <h1 id="pkTitle">Загружаем…</h1>
    <p class="pk-note" id="pkNote" hidden></p>
    <div class="pk-agent" id="pkAgent" hidden></div>
  </header>
  <div class="pk-map" id="pkMap" hidden></div>
  <ol class="pk-list" id="pkList"></ol>
</main>
<div class="pk-agent-bar" id="pkBar" hidden></div>
<dialog id="pkPhoto" class="pk-photo"><img id="pkPhotoImg" alt=""><button type="button" class="close" id="pkPhotoClose" aria-label="Закрыть">✕</button>
  <button type="button" class="pk-nav prev" id="pkPrev" aria-label="Предыдущее фото">‹</button><button type="button" class="pk-nav next" id="pkNext" aria-label="Следующее фото">›</button></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/icons.js?v=6"></script>
<script src="/static/pickers.js?v=10"></script>
<script src="/static/max.js?v=2"></script>
<script src="/static/pick.js?v=8"></script>
</body>
</html>
