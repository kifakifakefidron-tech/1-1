<main class="doc rq">
  <h1>Запросы покупателей</h1>
  <p class="lead">Кто сейчас ищет объект — запросы «куплю», «ищу», «есть клиент» из риелторских чатов Краснодара.
    Запрос держится 10 дней, пока его повторяют; рекламу выкупа и услуг не показываем.</p>
  <p class="rq-stat" id="rqCount"></p>
  <section class="rq-lockbox" id="rqLocked" hidden></section>
  <div class="rq-tools" id="rqTools" hidden>
    <div class="rq-tabs" role="tablist"><button type="button" class="on" data-tab="all">Все</button>
      <button type="button" data-tab="mine">Под мои объекты <b id="rqMineN"></b></button></div>
    <div class="rq-chipsbar">
      <button type="button" class="chip" data-deal="sale">Покупка</button><button type="button" class="chip" data-deal="rent">Аренда</button>
      <span class="rq-sep"></span>
      <button type="button" class="chip" data-rooms="0">Студия</button><button type="button" class="chip" data-rooms="1">1</button>
      <button type="button" class="chip" data-rooms="2">2</button><button type="button" class="chip" data-rooms="3">3</button>
      <button type="button" class="chip" data-rooms="4">4+</button>
      <input class="rq-search" id="rqQ" type="search" placeholder="Поиск: ЖК, район, «ипотека»…" aria-label="Поиск по запросам">
    </div>
    <p class="note rq-minehint" id="rqMineHint" hidden></p>
  </div>
  <ul class="rq-list" id="rqList"></ul>
  <div class="more-results"><button type="button" id="rqMore" class="pill" hidden>Показать ещё</button></div>
</main>
